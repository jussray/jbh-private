name = "jbh-private-payment-control"
main = "admin/payment-worker/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
keep_vars = true

[build]
command = "npm run verify:worker:cloudflare"

[observability]
enabled = true

# Preserve the production service binding introduced by the Nov 25 API deployment.
# Owner credentials remain provider-held secrets; live receipt activation is separate.
[[services]]
binding = "JUSSPAY"
service = "jusspay"
