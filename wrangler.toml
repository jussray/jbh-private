name = "jbh-private-payment-control"
main = "admin/payment-worker/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
keep_vars = true

[build]
command = "npm run verify:worker:cloudflare"

# Broad private ingress baseline. Signed Shopify/Stripe verification and
# Cloudflare Access authorization remain the route-specific trust gates.
[[ratelimits]]
name = "JBH_PRIVATE_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 120, period = 60 }

[observability]
enabled = true
