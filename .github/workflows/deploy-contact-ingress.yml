name: Deploy Private Contact Ingress

on:
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: "Type exactly DEPLOY_JBH_CONTACT_INGRESS"
        required: true
        type: string
      route_pattern:
        description: "Cloudflare route, for example contact.example.com/*"
        required: true
        type: string
      zone_name:
        description: "Cloudflare zone containing the route hostname"
        required: true
        type: string
      allowed_origins:
        description: "Comma-separated exact HTTPS storefront origins"
        required: true
        type: string
      allowed_hostnames:
        description: "Comma-separated exact Turnstile storefront hostnames"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-jbh-contact-ingress-production
  cancel-in-progress: false

env:
  EXPECTED_HEAD_SHA: ${{ github.sha }}
  EXPECTED_NPM_VERSION: "10.9.2"
  GH_TOKEN: ${{ github.token }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Verify and deploy existing private contact Worker
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
      CONTACT_ROUTE_PATTERN: ${{ inputs.route_pattern }}
      CONTACT_ZONE_NAME: ${{ inputs.zone_name }}
      ALLOWED_CONTACT_ORIGINS: ${{ inputs.allowed_origins }}
      ALLOWED_CONTACT_HOSTNAMES: ${{ inputs.allowed_hostnames }}
      CONTACT_WRANGLER_CONFIG: contact-worker/wrangler.production.json
    steps:
      - name: Require main and explicit deployment approval
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$APPROVAL_PHRASE" = "DEPLOY_JBH_CONTACT_INGRESS"

      - name: Require private protected GitHub production membrane
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL:-https://api.github.com}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer $GH_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          curl -fsSL "${headers[@]}" "$api/repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/repository.json"
          curl -fsSL "${headers[@]}" "$api/repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/main-branch.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const root = process.env.RUNNER_TEMP;
          const repository = JSON.parse(readFileSync(`${root}/repository.json`, "utf8"));
          const main = JSON.parse(readFileSync(`${root}/main-branch.json`, "utf8"));
          if (repository.private !== true) {
            throw new Error("Production membrane failed: repository must be private.");
          }
          if (main.protected !== true) {
            throw new Error("Production membrane failed: main branch must be protected.");
          }
          const requiredStatusChecks = main.protection?.required_status_checks;
          const requiredContexts = [
            ...(Array.isArray(requiredStatusChecks?.contexts) ? requiredStatusChecks.contexts : []),
            ...(Array.isArray(requiredStatusChecks?.checks)
              ? requiredStatusChecks.checks.map((item) => item?.context).filter(Boolean)
              : []),
          ];
          if (requiredStatusChecks?.enforcement_level === "off" || !requiredContexts.includes("Verify test-ledger contract")) {
            throw new Error("Production membrane failed: Verify test-ledger contract must be required on main.");
          }
          console.log(JSON.stringify({
            repository: repository.full_name,
            visibility: repository.visibility,
            private: repository.private,
            mainProtected: main.protected,
            requiredStatusChecks: requiredContexts,
          }));
          NODE

      - name: Validate required bindings without printing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DATABASE_URL"
          test -n "$TURNSTILE_SECRET_KEY"
          test -n "$CONTACT_ROUTE_PATTERN"
          test -n "$CONTACT_ZONE_NAME"
          test -n "$ALLOWED_CONTACT_ORIGINS"
          test -n "$ALLOWED_CONTACT_HOSTNAMES"

      - name: Fetch exact requested head without reusable actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Select hosted Node 24 without setup-node
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -n "$node24_root"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'

      - name: Verify declared npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          declared="$(node -p "require('./package.json').packageManager")"
          test "$declared" = "npm@${EXPECTED_NPM_VERSION}"
          actual="$(npx --yes "npm@${EXPECTED_NPM_VERSION}" --version)"
          printf 'declared=%s\nresolved=npm@%s\n' "$declared" "$actual"
          test "$actual" = "$EXPECTED_NPM_VERSION"

      - name: Install locked dependencies
        run: npx --yes "npm@${EXPECTED_NPM_VERSION}" ci

      - name: Verify private ingress contract
        run: npm run verify:contact-ingress

      - name: Validate route, origins, and Turnstile hostnames
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const route = process.env.CONTACT_ROUTE_PATTERN || '';
          const zone = process.env.CONTACT_ZONE_NAME || '';
          const origins = (process.env.ALLOWED_CONTACT_ORIGINS || '').split(',').map(v => v.trim()).filter(Boolean);
          const hostnames = (process.env.ALLOWED_CONTACT_HOSTNAMES || '').split(',').map(v => v.trim().toLowerCase()).filter(Boolean);
          if (!/^[a-z0-9.-]+\/\*$/.test(route)) throw new Error('invalid_route_pattern');
          if (!/^[a-z0-9.-]+$/.test(zone)) throw new Error('invalid_zone_name');
          const routeHost = route.slice(0, -2);
          if (routeHost !== zone && !routeHost.endsWith(`.${zone}`)) throw new Error('route_outside_zone');
          if (origins.length === 0 || hostnames.length === 0) throw new Error('empty_allowlist');

          const originHostnames = [];
          for (const origin of origins) {
            const url = new URL(origin);
            if (url.protocol !== 'https:' || url.origin !== origin || origin.includes('*')) {
              throw new Error('invalid_allowed_origin');
            }
            originHostnames.push(url.hostname.toLowerCase());
          }

          for (const hostname of hostnames) {
            if (!/^[a-z0-9.-]+$/.test(hostname) || hostname.includes('*')) {
              throw new Error('invalid_allowed_hostname');
            }
          }

          const originSet = new Set(originHostnames);
          const hostnameSet = new Set(hostnames);
          for (const hostname of originSet) {
            if (!hostnameSet.has(hostname)) throw new Error('origin_hostname_not_turnstile_allowed');
          }
          for (const hostname of hostnameSet) {
            if (!originSet.has(hostname)) throw new Error('turnstile_hostname_without_allowed_origin');
          }
          NODE

      - name: Render immutable production Wrangler config and secret file
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('contact-worker/wrangler.jsonc', 'utf8'));
          source.routes = [{
            pattern: process.env.CONTACT_ROUTE_PATTERN,
            zone_name: process.env.CONTACT_ZONE_NAME,
          }];
          source.vars = {
            ALLOWED_CONTACT_ORIGINS: process.env.ALLOWED_CONTACT_ORIGINS,
            ALLOWED_CONTACT_HOSTNAMES: process.env.ALLOWED_CONTACT_HOSTNAMES,
          };
          fs.writeFileSync(process.env.CONTACT_WRANGLER_CONFIG, JSON.stringify(source, null, 2));

          const secrets = {
            DATABASE_URL: process.env.DATABASE_URL,
            TURNSTILE_SECRET_KEY: process.env.TURNSTILE_SECRET_KEY,
          };
          const required = ['DATABASE_URL', 'TURNSTILE_SECRET_KEY'];
          for (const key of required) {
            if (!secrets[key]) throw new Error(`missing_${key.toLowerCase()}`);
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/contact-secrets.json', JSON.stringify(secrets));
          NODE

      - name: Prove Worker service already exists
        run: npx wrangler deployments list --config "$CONTACT_WRANGLER_CONFIG"

      - name: Deploy exact verified code, routes, variables, and secrets together
        run: npx wrangler deploy --strict --secrets-file "$RUNNER_TEMP/contact-secrets.json" --config "$CONTACT_WRANGLER_CONFIG"

      - name: Remove generated config and temporary secret file
        if: always()
        shell: bash
        run: rm -f "$CONTACT_WRANGLER_CONFIG" "$RUNNER_TEMP/contact-secrets.json"
