name: Control Room Test Ledger

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GH_TOKEN: ${{ github.token }}
  CONTROL_ROOM_LEDGER_SELF_CHECK: Verify test-ledger contract
  CONTROL_ROOM_TEST_LEDGER_PATH: artifacts/control-room-test-ledger.json

concurrency:
  group: control-room-test-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: Verify test-ledger contract
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact head without reusable actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Select hosted Node 24 without setup-node
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'

      - name: Run Control Room test-ledger contracts
        run: node --test test/control-room-test-ledger.test.mjs

      - name: Observe every exact-head check lane
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/control-room-test-ledger.mjs

      - name: Retain repository-local Control Room ledger in workflow logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CONTROL_ROOM_TEST_LEDGER_PATH"
          sha256sum "$CONTROL_ROOM_TEST_LEDGER_PATH" | tee artifacts/control-room-test-ledger.sha256
          {
            echo '### Control Room test-ledger receipt'
            echo
            echo '```text'
            cat artifacts/control-room-test-ledger.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
