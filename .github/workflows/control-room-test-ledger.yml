name: Control Room Test Ledger

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  repository_dispatch:
    types: [runtime_state_changed]
  workflow_dispatch:
    inputs:
      external_state_epoch:
        description: Non-secret sha256 state epoch from the provider or authority that observed runtime state movement
        required: false
        type: string
      external_state_source:
        description: Provider or authority identifier for the observed runtime state movement
        required: false
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GH_TOKEN: ${{ github.token }}
  CONTROL_ROOM_LEDGER_SELF_CHECK: Verify test-ledger contract
  CONTROL_ROOM_TEST_LEDGER_PATH: artifacts/control-room-test-ledger.json
  CONTROL_ROOM_RUNTIME_STATE_PATH: artifacts/control-room-runtime-state.json
  CONTROL_ROOM_EXTERNAL_STATE_ACTION: ${{ github.event.action || '' }}
  CONTROL_ROOM_EXTERNAL_STATE_EPOCH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.external_state_epoch || inputs.external_state_epoch || '' }}
  CONTROL_ROOM_EXTERNAL_STATE_SOURCE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source || inputs.external_state_source || '' }}
  # Trusted scope inputs for manifest signals that declare scope.workflowPath.
  PR_NUMBER: ${{ github.event.pull_request.number }}
  TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PUSH_BEFORE_SHA: ${{ github.event.before }}

concurrency:
  group: control-room-test-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: Verify test-ledger contract
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact head without reusable actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Select hosted Node 24 without setup-node
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'

      - name: Run Control Room test-ledger contracts
        run: node --test test/control-room-test-ledger.test.mjs


      - name: Verify runtime-state invalidation contract
        run: node --test test/control-room-runtime-state.test.mjs

      - name: Record tracked config and runtime-state proof boundary
        run: node scripts/control-room-runtime-state.mjs

      - name: Observe every exact-head check lane
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/control-room-test-ledger.mjs

      - name: Retain repository-local Control Room ledger in workflow logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CONTROL_ROOM_TEST_LEDGER_PATH"
          test -s "$CONTROL_ROOM_RUNTIME_STATE_PATH"
          sha256sum "$CONTROL_ROOM_TEST_LEDGER_PATH" "$CONTROL_ROOM_RUNTIME_STATE_PATH" | tee artifacts/control-room-test-ledger.sha256
          {
            echo '### Control Room test-ledger receipt'
            echo
            echo '```text'
            cat artifacts/control-room-test-ledger.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
