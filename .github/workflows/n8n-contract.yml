name: n8n Vendor Contract

on:
  pull_request:
    paths:
      - "automation/n8n/**"
      - ".github/workflows/n8n-contract.yml"
  push:
    branches:
      - main
    paths:
      - "automation/n8n/**"
      - ".github/workflows/n8n-contract.yml"

permissions:
  contents: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  n8n-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact head without reusable actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth" fetch --no-tags --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Select hosted Node 24 without setup-node
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -n "$node24_root"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'

      - name: Validate all workflow JSON
        run: >-
          node -e "const fs=require('fs'); const dir='automation/n8n'; const files=fs.readdirSync(dir).filter(f=>f.endsWith('.workflow.json')); if(!files.length) throw new Error('no n8n workflows'); for(const f of files) JSON.parse(fs.readFileSync(dir+'/'+f,'utf8')); console.log('validated', files.length, 'workflow files')"

      - name: Run all n8n contract tests
        run: node --test automation/n8n/*.test.mjs
