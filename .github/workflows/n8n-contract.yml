name: n8n Vendor Contract

on:
  pull_request:
    paths:
      - "automation/n8n/**"
      - ".github/workflows/n8n-contract.yml"
  push:
    branches:
      - main
    paths:
      - "automation/n8n/**"
      - ".github/workflows/n8n-contract.yml"

permissions:
  contents: read

jobs:
  n8n-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate all workflow JSON
        run: >-
          node -e "const fs=require('fs'); const dir='automation/n8n'; const files=fs.readdirSync(dir).filter(f=>f.endsWith('.workflow.json')); if(!files.length) throw new Error('no n8n workflows'); for(const f of files) JSON.parse(fs.readFileSync(dir+'/'+f,'utf8')); console.log('validated', files.length, 'workflow files')"

      - name: Run all n8n contract tests
        run: node --test automation/n8n/*.test.mjs
