name: Apply JussPay Live Receipt Migration

on:
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: "Type exactly APPLY_JUSSPAY_LIVE_RECEIPTS"
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: jusspay-live-receipts-production-migration
  cancel-in-progress: false

env:
  EXPECTED_HEAD_SHA: ${{ github.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  migrate:
    name: Apply and verify isolated live receipt tables
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: production-payments
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
    steps:
      - name: Require main, explicit approval, and database access
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$APPROVAL_PHRASE" = "APPLY_JUSSPAY_LIVE_RECEIPTS"
          test -n "$DATABASE_URL"
          command -v psql >/dev/null

      - name: Check out exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Apply additive JussPay live receipt migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --file=admin/migrations/019_jusspay_live_receipts.sql

      - name: Verify live receipt tables and constraints
        id: postflight
        shell: bash
        run: |
          set -euo pipefail
          result="$(psql "$DATABASE_URL" --tuples-only --no-align --set=ON_ERROR_STOP=1 --command="
            SELECT
              to_regclass('public.jusspay_live_receipts') IS NOT NULL
              AND to_regclass('public.jusspay_live_holds') IS NOT NULL
              AND (SELECT COUNT(*) = 6 FROM information_schema.columns
                   WHERE table_schema='public' AND table_name='jusspay_live_receipts')
              AND (SELECT COUNT(*) = 5 FROM information_schema.columns
                   WHERE table_schema='public' AND table_name='jusspay_live_holds')
              AND EXISTS (SELECT 1 FROM pg_constraint
                          WHERE conname='jusspay_live_receipts_pkey')
              AND EXISTS (SELECT 1 FROM pg_constraint
                          WHERE conname='jusspay_live_holds_pkey')
              AND EXISTS (SELECT 1 FROM pg_constraint
                          WHERE conname='jusspay_live_receipts_state_check')
              AND EXISTS (SELECT 1 FROM pg_constraint
                          WHERE conname='jusspay_live_holds_reason_check');
          ")"
          test "$result" = "t"
          printf 'JussPay live receipt schema verified for %s\n' "$EXPECTED_HEAD_SHA"

      - name: Publish exact-head migration status
        if: always()
        shell: bash
        env:
          POSTFLIGHT_OUTCOME: ${{ steps.postflight.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description="JussPay live receipt migration did not complete"
          if [ "$POSTFLIGHT_OUTCOME" = "success" ]; then
            state=success
            description="JussPay live receipt tables and constraints verified"
          fi
          node -e 'const [state,context,description]=process.argv.slice(1); process.stdout.write(JSON.stringify({state,context,description}))' \
            "$state" "jusspay-live-receipts-migration" "$description" > "$RUNNER_TEMP/migration-status.json"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD_SHA" \
            --data-binary @"$RUNNER_TEMP/migration-status.json"

      - name: Fail unless postflight passed
        if: steps.postflight.outcome != 'success'
        run: exit 1
