name: Private Security Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify owner and payment boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Verify repository deployment split
        run: node scripts/verify-private-deployment-boundary.mjs
      - run: npm ci
        working-directory: admin
      - name: Verify owner/admin data boundary
        run: npm run security:owner-admin
        working-directory: admin
      - name: Verify isolated payment Worker boundary
        run: npm run security:payment-worker
        working-directory: admin
      - name: Typecheck owner admin
        run: npm run check
        working-directory: admin
      - name: Typecheck payment Worker
        run: npm run check:payment-worker
        working-directory: admin
      - name: Build local-only owner admin
        run: npm run build
        working-directory: admin
      - name: Re-verify after build
        run: node scripts/verify-private-deployment-boundary.mjs
