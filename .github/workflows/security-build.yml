name: Private Security Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Typecheck, build, and Playwright private control layer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install locked dependencies once
        run: npm ci
      - name: Verify repository MCP boundaries
        run: npm run verify:mcp
      - name: Verify AI skill contract and provenance
        run: npm run verify:ai-skills
      - name: Typecheck private admin
        run: npm run check
      - name: Build private admin
        run: npm run build
      - name: Install pinned Playwright verifier
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.61.1
      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Verify blended brand moat in browser
        run: npm run verify:playwright
