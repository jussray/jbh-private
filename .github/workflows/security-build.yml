name: Private security build

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '24'
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  
jobs:
  verify:
    name: Typecheck, build, and Playwright private control layer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Check out immutable target head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Record and verify immutable head
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - name: Install private admin dependencies
        run: npm ci
      - name: Verify MCP config
        run: npm run verify:mcp
      - name: Verify Shopify supplier intake contracts
        run: node --test tests/shopify-supplier-sku-alias-contract.test.mjs tests/fulfillment-orchestrator-state-contract.test.mjs
      - name: Verify Faire wholesale math
        run: node --test tests/faire-wholesale-math-contract.test.mjs
      - name: Typecheck private admin
        run: npm run check
      - name: Build private admin
        run: npm run build
      - name: Install pinned Playwright verifier for private admin
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.61.1
      - name: Install Chromium for private admin proof
        run: npm exec -- playwright install --with-deps chromium
      - name: Verify approved storefront truth mirror in browser
        run: npm run verify:playwright

      - name: Install exact root Worker dependencies
        working-directory: .
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Verify private Worker contracts and dry run
        working-directory: .
        run: npm run verify:worker
      - name: Install pinned root Playwright verifier
        working-directory: .
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.61.1
      - name: Install Chromium for private Worker proof
        working-directory: .
        run: npx playwright install --with-deps chromium
      - name: Start exact-head private Worker locally
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8792 > "$RUNNER_TEMP/jbh-private-wrangler.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/jbh-private-wrangler.pid"
          for attempt in {1..60}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8792/health || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/jbh-private-wrangler.log" >&2
          exit 1
      - name: Run private ingress rate-limit Playwright witness through Wrangler
        working-directory: .
        env:
          JBH_PRIVATE_EDGE_BASE_URL: http://127.0.0.1:8792
        run: node scripts/private-rate-limit-playwright.mjs
      - name: Stop exact-head private Worker
        if: always()
        working-directory: .
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/jbh-private-wrangler.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/jbh-private-wrangler.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/jbh-private-wrangler.log" ]; then
            cat "$RUNNER_TEMP/jbh-private-wrangler.log"
          fi
