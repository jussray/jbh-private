name: Private Security Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: private-security-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build private control layer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Verify AI sales and devil skills
        working-directory: ${{ github.workspace }}
        run: node scripts/verify-ai-skills.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Verify repository MCP boundaries
        run: npm run verify:mcp
      - name: Typecheck private admin
        run: npm run check
      - name: Build private admin
        run: npm run build
