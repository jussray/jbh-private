name: Private Security Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Typecheck and build private control layer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify repository MCP boundaries
        run: npm run verify:mcp
      - name: Typecheck private admin
        run: npm run check
      - name: Build private admin
        run: npm run build
