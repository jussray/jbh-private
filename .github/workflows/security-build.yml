name: Private security build
# Exact-head proof refresh marker: keep this lane on PR synchronize events.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build, and Playwright private control layer
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Fetch immutable target head without reusable actions
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Select hosted Node 24 without setup-node
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -n "$node24_root"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'
          "$node24_root/x64/bin/npm" --version

      - name: Install dependencies
        run: npm ci

      - name: Classify admin dependency advisories
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > admin-audit.json || true
          npm audit --omit=dev --json > admin-production-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const readAudit = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const rowsFor = (audit) => Object.entries(audit.vulnerabilities || {}).map(([name, v]) => ({
            name,
            severity: v.severity,
            direct: Boolean(v.isDirect),
            range: v.range || '',
            fixAvailable: v.fixAvailable === true ? 'yes' : v.fixAvailable ? JSON.stringify(v.fixAvailable) : 'no',
            via: (v.via || []).map(x => typeof x === 'string' ? x : `${x.source}:${x.title}`).join(' | '),
            effects: (v.effects || []).join(', '),
          })).sort((a, b) => a.name.localeCompare(b.name));

          const audit = readAudit('admin-audit.json');
          const productionAudit = readAudit('admin-production-audit.json');
          const rows = rowsFor(audit);
          const productionRows = rowsFor(productionAudit);

          console.log(JSON.stringify({
            allDependencies: {metadata: audit.metadata, vulnerabilities: rows},
            productionRuntime: {metadata: productionAudit.metadata, vulnerabilities: productionRows},
          }, null, 2));

          const lines = [
            '### Admin dependency audit',
            '',
            '**Policy:** moderate/high production-runtime advisories and any critical advisory block. Dev-tooling-only high/moderate advisories remain visible and require build + Playwright proof.',
            '',
            '| Package | Severity | Direct | Range | Fix | Via | Effects |',
            '|---|---|---:|---|---|---|---|',
          ];
          for (const row of rows) lines.push(`| ${row.name} | ${row.severity} | ${row.direct ? 'yes' : 'no'} | ${String(row.range).replace(/\|/g,'\\|')} | ${String(row.fixAvailable).replace(/\|/g,'\\|')} | ${String(row.via).replace(/\|/g,'\\|')} | ${String(row.effects).replace(/\|/g,'\\|')} |`);
          lines.push('', `Production-runtime advisory count: ${productionRows.length}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');

          const productionBlocking = productionRows.filter(row => ['moderate', 'high', 'critical'].includes(row.severity));
          const criticalAnywhere = rows.filter(row => row.severity === 'critical');
          if (productionBlocking.length || criticalAnywhere.length) process.exit(1);
          NODE

      - name: Verify MCP config
        run: npm run verify:mcp
      - name: Verify Shopify supplier intake contracts
        run: node --test tests/shopify-supplier-sku-alias-contract.test.mjs tests/fulfillment-orchestrator-state-contract.test.mjs
      - name: Verify Faire wholesale math
        run: node --test tests/faire-wholesale-math-contract.test.mjs
      - name: Typecheck private admin
        run: npm run check
      - name: Build private admin
        run: npm run build
      - name: Install pinned Playwright verifier
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.61.1
      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Verify approved storefront truth mirror in browser
        run: npm run verify:playwright
