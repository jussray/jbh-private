name: Private Security Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify local-only owner control layer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Verify no deployment path exists
        run: node scripts/verify-private-deployment-boundary.mjs
      - run: npm ci
        working-directory: admin
      - name: Verify owner/admin data boundary
        run: npm run security:owner-admin
        working-directory: admin
      - run: npm run check
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - name: Re-verify after build
        run: node scripts/verify-private-deployment-boundary.mjs
