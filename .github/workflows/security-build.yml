name: Private Security Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify owner and payment boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Verify repository deployment split
        run: |
          mkdir -p ci-diagnostics
          node scripts/verify-private-deployment-boundary.mjs 2>&1 | tee ci-diagnostics/01-repository-boundary.log

      - name: Install locked dependencies
        run: |
          cd admin
          npm ci 2>&1 | tee ../ci-diagnostics/02-npm-ci.log

      - name: Verify owner/admin data boundary
        run: |
          cd admin
          npm run security:owner-admin 2>&1 | tee ../ci-diagnostics/03-owner-boundary.log

      - name: Verify isolated payment Worker boundary
        run: |
          cd admin
          npm run security:payment-worker 2>&1 | tee ../ci-diagnostics/04-payment-boundary.log

      - name: Typecheck owner admin
        run: |
          cd admin
          npm run check 2>&1 | tee ../ci-diagnostics/05-owner-typecheck.log

      - name: Typecheck payment Worker
        run: |
          cd admin
          npm run check:payment-worker 2>&1 | tee ../ci-diagnostics/06-payment-typecheck.log

      - name: Build local-only owner admin
        run: |
          cd admin
          npm run build 2>&1 | tee ../ci-diagnostics/07-owner-build.log

      - name: Re-verify after build
        run: |
          node scripts/verify-private-deployment-boundary.mjs 2>&1 | tee ci-diagnostics/08-post-build-boundary.log

      - name: Upload bounded CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-security-diagnostics
          path: ci-diagnostics/*.log
          if-no-files-found: warn
          retention-days: 3
