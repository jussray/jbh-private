name: JBH Runner Health Probe

on:
  pull_request:
    paths:
      - ".github/workflows/runner-health-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Prove checkout action can start
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prove runner after checkout
        shell: bash
        run: |
          printf 'runner_name=%s\n' "$RUNNER_NAME"
          git rev-parse HEAD
