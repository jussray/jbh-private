name: JBH Root Lockfile Bootstrap

on:
  push:
    branches:
      - fix/contact-ingress-current-main-20261001
    paths:
      - ".github/workflows/runner-health-probe.yml"

permissions:
  contents: write

jobs:
  lockfile:
    name: Generate root npm lockfile from exact pinned manifest
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.sha }}
      PUSH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact branch head without reusable actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Select hosted Node 24
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'

      - name: Generate npm 10.9.2 root lockfile only
        shell: bash
        run: |
          set -euo pipefail
          test ! -e package-lock.json
          npx --yes npm@10.9.2 install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if (p.lockfileVersion < 3) process.exit(1); console.log('lockfileVersion='+p.lockfileVersion)"

      - name: Commit lockfile to this repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Juss"
          git config user.email "286642846+jussray@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --exit-code && { echo 'no lockfile delta'; exit 1; } || true
          git commit -m "build(deps): add root npm lockfile"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/contact-ingress-current-main-20261001
