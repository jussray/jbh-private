name: X Engagement Gate Adapter Exact-Head

on:
  pull_request:
    branches: [main]
    paths:
      - "automation/social/**"
      - "package.json"
      - ".gitignore"
      - "skills/juss-beautiful-hair-private/SKILL.md"
      - ".github/workflows/x-engagement-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x-engagement-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify X engagement adapter
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Fetch exact requested head without reusable actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Select hosted Node 24 without setup-node
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'

      - name: Install exact declared dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify adapter without live Apify credentials
        env:
          APIFY_TOKEN: ""
        run: npm run verify:x-engagement
