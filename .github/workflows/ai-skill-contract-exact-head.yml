name: Private Hair AI Skill Contract Exact-Head Gate

# Revalidation note: current-main proof refresh for Plugin Management authority; no runtime or private-data behavior changes.

on:
  pull_request:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "AGENTS_FOUNDER_INTELLIGENCE.md"
      - "skills/juss-beautiful-hair-private/**"
      - ".agents/skills/jbh-private-operator/**"
      - "skills/sales/**"
      - "skills/devil/**"
      - "brand/BRAND_MOAT.md"
      - "artifacts/redteam/SALES_DEVIL_ATTACK.md"
      - "artifacts/lindymode/SALES_DURABILITY.md"
      - "artifacts/l99/SALES_AUTHORITY_MODEL.md"
      - "artifacts/ooda/SALES_EXECUTION_LOOP.md"
      - "artifacts/ultrathink/SALES_DEVIL_SYNTHESIS.md"
      - "artifacts/billgates/SALES_PLATFORM_LEVERAGE.md"
      - ".control-room/plugin-management.json"
      - "scripts/verify-plugin-management-contract.mjs"
      - "scripts/verify-ai-skill-contract.mjs"
      - "admin/package.json"
      - ".github/workflows/ai-skill-contract-exact-head.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-hair-ai-skill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify private hair AI skill contract
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fetch immutable target head without reusable actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Select hosted Node 24 without setup-node
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -n "$node24_root"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'
          "$node24_root/x64/bin/npm" --version

      - name: Validate private admin package metadata
        run: node -e "JSON.parse(require('node:fs').readFileSync('admin/package.json', 'utf8'))"

      - name: Verify ChatGPT plugin management contract
        run: node scripts/verify-plugin-management-contract.mjs

      - name: Verify portable Juss OS and private authority contract
        run: npm --prefix admin run verify:ai-skills
