name: Deploy Private Payment Control

on:
  workflow_dispatch:
    inputs:
      approve_deployment:
        description: Approve deployment of the verified current main
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-jbh-private-payment-control-production
  cancel-in-progress: false

env:
  EXPECTED_HEAD_SHA: ${{ github.sha }}
  EXPECTED_NPM_VERSION: "10.9.2"
  GH_TOKEN: ${{ github.token }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    if: github.repository == 'jussray/jbh-private' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && inputs.approve_deployment == true
    name: Verify exact head and deploy private payment control
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPROVAL_PHRASE: DEPLOY_JBH_PRIVATE_PAYMENT_CONTROL
    steps:
      - name: Require main, explicit approval, and Cloudflare deployment bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$APPROVAL_PHRASE" = "DEPLOY_JBH_PRIVATE_PAYMENT_CONTROL"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Fetch exact target head without reusable actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Select hosted Node 24
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -n "$node24_root"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'

      - name: Verify declared npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          declared="$(node -p "require('./package.json').packageManager")"
          test "$declared" = "npm@${EXPECTED_NPM_VERSION}"
          actual="$(npx --yes "npm@${EXPECTED_NPM_VERSION}" --version)"
          test "$actual" = "$EXPECTED_NPM_VERSION"

      - name: Install locked dependencies
        run: npx --yes "npm@${EXPECTED_NPM_VERSION}" ci

      - name: Verify exact private Worker before deployment
        run: npm run verify:worker:cloudflare

      - name: Prove canonical Worker already exists
        run: npx wrangler deployments list --config wrangler.toml

      - name: Resolve authoritative existing payment configuration
        run: node scripts/resolve-payment-deploy-bindings.mjs

      - name: Deploy exact verified private Worker
        shell: bash
        run: |
          set -euo pipefail
          live_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$live_main" = "$EXPECTED_HEAD_SHA"
          npx wrangler deploy --strict --config wrangler.toml \
            --var "RELEASE_SHA:$EXPECTED_HEAD_SHA" \
            --var "SHOPIFY_ADMIN_API_VERSION:$SHOPIFY_ADMIN_API_VERSION" \
            --var "DROPSHIP_BEAUTY_LOCATION_GID:$DROPSHIP_BEAUTY_LOCATION_GID"
