name: Paid Order Reconciliation Exact-Head Gate

on:
  pull_request:
    paths:
      - ".control-room/commerce-seam.json"
      - "package.json"
      - "README.md"
      - "wrangler.toml"
      - "scripts/verify-commerce-seam.mjs"
      - "scripts/verify-cloudflare-worker-identity.mjs"
      - "admin/README.md"
      - "admin/payment-worker/**"
      - "admin/tests/private-order-worker-contract.test.mjs"
      - "admin/tests/private-order-worker-shopify-physical.test.mjs"
      - "admin/tests/private-order-worker-shopify-physical-contract.test.mjs"
      - "admin/tests/shopify-customer-contact-contract.test.mjs"
      - "admin/tests/migration-ledger-contract.test.mjs"
      - "admin/api/stripe/webhook.ts"
      - "admin/api/_lib/storage.ts"
      - "admin/shared/schema.ts"
      - "admin/migrations/002_unique_stripe_session.sql"
      - "admin/migrations/008_shopify_physical_procurement.sql"
      - "admin/migrations/009_vendor_connection_state.sql"
      - "admin/migrations/011_shopify_customer_contact.sql"
      - "admin/migrations/012_dropship_beauty_sku_families.sql"
      - "admin/migrations/013_dispatch_authority_gate.sql"
      - "admin/migrations/014_shopify_physical_dispatch_gate.sql"
      - "admin/scripts/preflight-shopify-physical-order-schema.mjs"
      - "admin/tests/shopify-physical-schema-preflight-contract.test.mjs"
      - "admin/tests/vendor-connection-state-contract.test.mjs"
      - "admin/tests/vendor-dispatch-authority-contract.test.mjs"
      - "admin/tests/shopify-physical-dispatch-authority-contract.test.mjs"
      - "admin/scripts/preflight-paid-order-migration.mjs"
      - "admin/tests/paid-order-reconciliation-contract.test.mjs"
      - "admin/tests/paid-order-migration-preflight-contract.test.mjs"
      - "admin/package.json"
      - ".github/workflows/paid-order-reconciliation-exact-head.yml"
      - ".github/workflows/paid-order-production-preflight.yml"
      - ".github/workflows/apply-paid-order-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paid-order-private-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    working-directory: admin

jobs:
  verify:
    name: Verify private paid-order reconciliation
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact requested head without reusable actions
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Select hosted Node 24 without setup-node
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -n "$node24_root"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'

      - name: Install private admin dependencies
        run: npm ci

      - name: Install locked private Worker dependencies
        working-directory: ${{ github.workspace }}
        run: npx --yes "npm@10.9.2" ci --ignore-scripts --no-audit --no-fund

      - name: Verify private order Worker and Cloudflare identity
        working-directory: ${{ github.workspace }}
        run: npm run verify:worker:cloudflare

      - name: Run private admin TypeScript
        run: npm run check

      - name: Run focused reconciliation contracts
        run: node --test tests/paid-order-reconciliation-contract.test.mjs tests/paid-order-migration-preflight-contract.test.mjs tests/private-order-worker-shopify-physical-contract.test.mjs

      - name: Verify Shopify customer contact compatibility contract
        run: node --test tests/shopify-customer-contact-contract.test.mjs

      - name: Verify migration ledger uniqueness contract
        run: node --test tests/migration-ledger-contract.test.mjs

      - name: Verify Shopify physical schema preflight contract
        run: node --test tests/shopify-physical-schema-preflight-contract.test.mjs

      - name: Verify vendor connection and dispatch authority contracts
        run: node --test tests/vendor-connection-state-contract.test.mjs tests/vendor-dispatch-authority-contract.test.mjs tests/shopify-physical-dispatch-authority-contract.test.mjs

      - name: Build private admin
        run: npm run build
