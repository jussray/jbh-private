name: Paid Order Reconciliation Exact-Head Gate

on:
  pull_request:
    paths:
      - ".control-room/commerce-seam.json"
      - "package.json"
      - "README.md"
      - "wrangler.toml"
      - "scripts/verify-commerce-seam.mjs"
      - "admin/README.md"
      - "admin/payment-worker/**"
      - "admin/tests/private-order-worker-contract.test.mjs"
      - "admin/tests/private-order-worker-shopify-physical.test.mjs"
      - "admin/tests/private-order-worker-shopify-physical-contract.test.mjs"
      - "admin/api/stripe/webhook.ts"
      - "admin/api/_lib/storage.ts"
      - "admin/shared/schema.ts"
      - "admin/migrations/002_unique_stripe_session.sql"
      - "admin/migrations/008_shopify_physical_procurement.sql"
      - "admin/migrations/009_vendor_connection_state.sql"
      - "admin/tests/vendor-connection-state-contract.test.mjs"
      - "admin/scripts/preflight-paid-order-migration.mjs"
      - "admin/tests/paid-order-reconciliation-contract.test.mjs"
      - "admin/tests/paid-order-migration-preflight-contract.test.mjs"
      - "admin/package.json"
      - ".github/workflows/paid-order-reconciliation-exact-head.yml"
      - ".github/workflows/paid-order-production-preflight.yml"
      - ".github/workflows/apply-paid-order-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paid-order-private-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

defaults:
  run:
    working-directory: admin

jobs:
  verify:
    name: Verify private paid-order reconciliation
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Record and verify exact head
        shell: bash
        working-directory: .
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install private admin dependencies
        run: npm ci

      - name: Install private Worker dependencies
        working-directory: .
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify private order Worker
        working-directory: .
        run: npm run verify:worker

      - name: Run private admin TypeScript
        run: npm run check

      - name: Run focused reconciliation contracts
        run: node --test tests/paid-order-reconciliation-contract.test.mjs tests/paid-order-migration-preflight-contract.test.mjs tests/private-order-worker-shopify-physical-contract.test.mjs

      - name: Verify vendor connection state contract
        run: node --test tests/vendor-connection-state-contract.test.mjs

      - name: Build private admin
        run: npm run build
