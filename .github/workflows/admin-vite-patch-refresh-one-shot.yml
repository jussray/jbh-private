name: Admin Vite Patch Refresh One-Shot

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/package.json'
      - 'admin/package-lock.json'
      - '.github/workflows/admin-vite-patch-refresh-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  refresh-vite:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact head
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout -B "$HEAD_BRANCH" FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Select hosted Node 24
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'
          "$node24_root/x64/bin/npm" --version

      - name: Refresh Vite within approved semver range
        working-directory: admin
        run: npm update vite --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Prove patch-only clean graph
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- admin/package.json
          cd admin
          vite_version="$(node -p "require('./package-lock.json').packages['node_modules/vite'].version")"
          printf 'locked vite=%s\n' "$vite_version"
          case "$vite_version" in
            7.3.*) ;;
            *) echo "unexpected Vite line: $vite_version" >&2; exit 1 ;;
          esac
          npm ci
          npm audit --audit-level=low
          npm run check
          npm run build

      - name: Commit synchronized lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git add admin/package-lock.json
          if git diff --cached --quiet; then
            echo 'Vite lock already current and clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): refresh Vite patch lock to clear low advisory'
          git push origin "HEAD:${HEAD_BRANCH}"
