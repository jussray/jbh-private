name: Root Dependency Audit Exact-Head

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/root-dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_NPM_VERSION: "10.9.2"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  audit:
    name: Audit root dependency graph
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact requested head without reusable actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Select hosted Node 24 without setup-node
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'

      - name: Regenerate root lock for restored Apify client
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          npx --yes "npm@${EXPECTED_NPM_VERSION}" install --package-lock-only --ignore-scripts
          node --input-type=commonjs <<'NODE'
          const lock = require('./package-lock.json');
          if (lock.packages?.['']?.dependencies?.['apify-client'] !== '2.24.0') process.exit(1);
          if (lock.packages?.['node_modules/apify-client']?.version !== '2.24.0') process.exit(1);
          NODE
          npx --yes "npm@${EXPECTED_NPM_VERSION}" ci --ignore-scripts
          npm run verify:x-engagement
          npm audit --audit-level=high
          changes="$(git status --porcelain)"
          if [ -z "$changes" ]; then
            echo 'Root lock already synchronized.'
            exit 0
          fi
          test "$(printf '%s\n' "$changes" | wc -l | tr -d ' ')" = "1"
          printf '%s\n' "$changes" | grep -Eq '^ M package-lock\.json$'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): synchronize root Apify lock"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"

      - name: Install locked root dependency graph
        run: npx --yes "npm@${EXPECTED_NPM_VERSION}" ci --ignore-scripts

      - name: Capture and classify npm audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > root-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('root-audit.json', 'utf8'));
          const vulns = audit.vulnerabilities || {};
          const rows = Object.entries(vulns)
            .filter(([, v]) => ['high', 'critical'].includes(v.severity))
            .map(([name, v]) => ({
              name,
              severity: v.severity,
              direct: Boolean(v.isDirect),
              range: v.range || '',
              fixAvailable: v.fixAvailable === true ? 'yes' : v.fixAvailable ? JSON.stringify(v.fixAvailable) : 'no',
              via: (v.via || []).map(x => typeof x === 'string' ? x : `${x.source}:${x.title}`).join(' | '),
            }));
          console.log(JSON.stringify({metadata: audit.metadata, highOrCritical: rows}, null, 2));
          const lines = ['### Root dependency audit', '', '| Package | Severity | Direct | Range | Fix |', '|---|---|---:|---|---|'];
          for (const row of rows) lines.push(`| ${row.name} | ${row.severity} | ${row.direct ? 'yes' : 'no'} | ${String(row.range).replace(/\|/g,'\\|')} | ${String(row.fixAvailable).replace(/\|/g,'\\|')} |`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          if (rows.length) process.exit(1);
          NODE
