name: Control Room Signal Repair Once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/control-room-manifest-repair-once.yml"

permissions:
  contents: write

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BRANCH_NAME: ${{ github.head_ref }}
  GH_TOKEN: ${{ github.token }}

jobs:
  repair:
    name: Align Control Room required signal name
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact requested head
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Align manifest with actual paid-order check
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.control-room/repository.manifest.json')
          text = path.read_text()
          old = '"name": "Verify private paid-order control"'
          new = '"name": "Verify private paid-order reconciliation"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale signal name, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- .control-room/repository.manifest.json

      - name: Commit manifest repair only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BRANCH_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .control-room/repository.manifest.json
          git diff --cached --name-only | grep -Fx '.control-room/repository.manifest.json'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "fix(control-room): align required paid-order check name"
          git push origin "HEAD:${BRANCH_NAME}"
