name: Stage Private Worker Recovery

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact current main commit approved for staging
        required: true
        type: string
      active_version:
        description: Reviewed active Cloudflare version UUID
        required: true
        type: string
      approval_phrase:
        description: Type exactly STAGE_JBH_WORKER_VERSION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-jbh-private-payment-control-production
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'jussray/jbh-private' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      JBH_RECOVERY_ACTIVE_VERSION: ${{ inputs.active_version }}
      JBH_RECOVERY_APPROVAL: ${{ inputs.approval_phrase }}
    steps:
      - name: Require exact owner-approved main and recovery UUID
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$JBH_RECOVERY_ACTIVE_VERSION" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]
          test "$JBH_RECOVERY_APPROVAL" = STAGE_JBH_WORKER_VERSION
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
          git init .
          git remote add origin https://github.com/jussray/jbh-private.git
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Select hosted Node 24
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'
      - name: Install locked dependencies without production credentials
        run: npx --yes npm@10.9.2 ci --ignore-scripts --no-audit --no-fund
      - name: Run recovery regression tests before staging
        run: node --test admin/tests/private-order-worker-version-recovery.test.mjs
      - name: Preflight and stage only; never promote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/private-worker-version-recovery.mjs --preflight
          node scripts/private-worker-version-recovery.mjs --stage
