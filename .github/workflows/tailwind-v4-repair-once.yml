name: Tailwind v4 Security Repair Once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tailwind-v4-repair-once.yml"

permissions:
  contents: write

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BRANCH_NAME: ${{ github.head_ref }}
  GH_TOKEN: ${{ github.token }}
  EXPECTED_NPM_VERSION: "10.9.2"

jobs:
  repair:
    name: Migrate Tailwind and regenerate admin lock
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact requested head
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$BRANCH_NAME"
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Select hosted Node 24
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'

      - name: Apply bounded Tailwind v4 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          admin = Path('admin')
          package_path = admin / 'package.json'
          package = json.loads(package_path.read_text())
          dev = package['devDependencies']
          dev['@tailwindcss/vite'] = '4.3.3'
          dev['tailwindcss'] = '4.3.3'
          dev.pop('autoprefixer', None)
          dev.pop('postcss', None)
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          vite_path = admin / 'vite.config.ts'
          vite = vite_path.read_text()
          if 'import tailwindcss from "@tailwindcss/vite";' not in vite:
              vite = vite.replace('import react from "@vitejs/plugin-react";\n', 'import react from "@vitejs/plugin-react";\nimport tailwindcss from "@tailwindcss/vite";\n')
          vite = vite.replace('plugins: [react()],', 'plugins: [react(), tailwindcss()],')
          vite_path.write_text(vite)

          css_path = admin / 'client/src/index.css'
          css = css_path.read_text()
          old = '@tailwind base;\n@tailwind components;\n@tailwind utilities;'
          new = '@import "tailwindcss";\n@config "../../tailwind.config.js";'
          if old not in css:
              raise SystemExit('expected Tailwind v3 directives not found')
          css_path.write_text(css.replace(old, new, 1))

          ts_config = admin / 'tailwind.config.ts'
          config = ts_config.read_text()
          config = config.replace('import type { Config } from "tailwindcss";\n\n', 'import animate from "tailwindcss-animate";\nimport typography from "@tailwindcss/typography";\n\n')
          config = config.replace('plugins: [require("tailwindcss-animate"), require("@tailwindcss/typography")],', 'plugins: [animate, typography],')
          config = config.replace('} satisfies Config;', '};')
          (admin / 'tailwind.config.js').write_text(config)
          ts_config.unlink()

          postcss = admin / 'postcss.config.js'
          if postcss.exists():
              postcss.unlink()
          PY

      - name: Regenerate locked admin dependency graph
        working-directory: admin
        run: npx --yes "npm@${EXPECTED_NPM_VERSION}" install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Prove frozen install and security posture
        working-directory: admin
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "npm@${EXPECTED_NPM_VERSION}" ci --ignore-scripts --no-fund
          npm audit --json > audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities || {};
          console.log(JSON.stringify(counts));
          if ((counts.moderate || 0) > 0 || (counts.high || 0) > 0 || (counts.critical || 0) > 0) process.exit(1);
          NODE
          rm -f audit.json
          npm run check
          npm run build

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(admin/package.json|admin/package-lock.json|admin/vite.config.ts|admin/client/src/index.css|admin/tailwind.config.js|admin/tailwind.config.ts|admin/postcss.config.js)$' || true)"
          test -z "$unexpected" || { printf 'unexpected files:\n%s\n' "$unexpected"; exit 1; }

      - name: Commit repaired graph only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- admin/package.json admin/package-lock.json admin/vite.config.ts admin/client/src/index.css admin/tailwind.config.js admin/tailwind.config.ts admin/postcss.config.js
          git diff --cached --exit-code && { echo 'No repair diff produced'; exit 1; } || true
          git commit -m "fix(security): migrate admin styling to Tailwind v4"
          git push origin "HEAD:${BRANCH_NAME}"
