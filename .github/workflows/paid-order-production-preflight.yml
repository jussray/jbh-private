name: Paid Order Production Preflight

on:
  push:
    branches: [main]
    paths:
      - "admin/migrations/002_unique_stripe_session.sql"
      - "admin/scripts/preflight-paid-order-migration.mjs"
      - "admin/package.json"
      - ".github/workflows/paid-order-production-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: paid-order-production-preflight
  cancel-in-progress: false

env:
  EXPECTED_HEAD_SHA: ${{ github.sha }}

jobs:
  preflight:
    name: Read-only Neon duplicate and index preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: production-payments
    defaults:
      run:
        working-directory: admin
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Record and verify exact head
        working-directory: .
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run read-only migration preflight
        id: preflight
        shell: bash
        run: |
          set +e
          npm run preflight:paid-order-migration
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish classified production preflight status
        if: always()
        uses: actions/github-script@v7
        env:
          PREFLIGHT_RESULT: ${{ steps.preflight.outputs.result || 'unknown-failure' }}
          PREFLIGHT_EXIT_CODE: ${{ steps.preflight.outputs.exit_code || '99' }}
        with:
          script: |
            const result = process.env.PREFLIGHT_RESULT;
            const passed = result.startsWith("passed-");
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EXPECTED_HEAD_SHA,
              state: passed ? "success" : "failure",
              context: `paid-order-production-preflight/${result}`,
              description: passed
                ? "Read-only Neon preflight passed"
                : `Read-only Neon preflight blocked (${process.env.PREFLIGHT_EXIT_CODE})`,
            });

      - name: Fail when production preflight did not pass
        if: steps.preflight.outputs.exit_code != '0'
        run: exit 1
