name: Paid Order Production Preflight

on:
  push:
    branches: [main]
    paths:
      - "admin/migrations/002_unique_stripe_session.sql"
      - "admin/scripts/preflight-paid-order-migration.mjs"
      - "admin/package.json"
      - ".github/workflows/paid-order-production-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: paid-order-production-preflight
  cancel-in-progress: false

env:
  EXPECTED_HEAD_SHA: ${{ github.sha }}

jobs:
  preflight:
    name: Read-only Neon duplicate and index preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Record and verify exact head
        working-directory: .
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run read-only migration preflight
        id: preflight
        continue-on-error: true
        run: npm run preflight:paid-order-migration

      - name: Publish production preflight status
        if: always()
        uses: actions/github-script@v7
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        with:
          script: |
            const passed = process.env.PREFLIGHT_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EXPECTED_HEAD_SHA,
              state: passed ? "success" : "failure",
              context: "paid-order-production-preflight",
              description: passed
                ? "Read-only Neon preflight passed"
                : "Read-only Neon preflight blocked or could not run",
            });

      - name: Fail when production preflight did not pass
        if: steps.preflight.outcome != 'success'
        run: exit 1
