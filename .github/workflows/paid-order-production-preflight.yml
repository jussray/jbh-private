name: Shopify Paid Order Production Preflight

on:
  push:
    branches: [main]
    paths:
      - "admin/migrations/008_shopify_physical_procurement.sql"
      - "admin/migrations/009_vendor_connection_state.sql"
      - "admin/migrations/011_shopify_customer_contact.sql"
      - "admin/scripts/preflight-shopify-physical-order-schema.mjs"
      - "admin/package.json"
      - ".github/workflows/paid-order-production-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: paid-order-production-preflight
  cancel-in-progress: false

env:
  EXPECTED_HEAD_SHA: ${{ github.sha }}

jobs:
  preflight:
    name: Read-only Shopify physical-order schema preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: production-payments
    defaults:
      run:
        working-directory: admin
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Record and verify exact head
        working-directory: .
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run read-only Shopify schema preflight
        id: preflight
        shell: bash
        run: |
          set +e
          npm run preflight:shopify-physical-schema
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish classified Shopify production preflight status
        if: always()
        uses: actions/github-script@v7
        env:
          PREFLIGHT_RESULT: ${{ steps.preflight.outputs.result || 'unknown-failure' }}
          PREFLIGHT_EXIT_CODE: ${{ steps.preflight.outputs.exit_code || '99' }}
        with:
          script: |
            const result = process.env.PREFLIGHT_RESULT;
            const passed = result === "passed-shopify-physical-schema";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EXPECTED_HEAD_SHA,
              state: passed ? "success" : "failure",
              context: `paid-order-production-preflight/shopify-${result}`,
              description: passed
                ? "Read-only Shopify physical-order schema preflight passed"
                : `Read-only Shopify schema preflight blocked (${process.env.PREFLIGHT_EXIT_CODE})`,
            });

      - name: Fail when Shopify production preflight did not pass
        if: steps.preflight.outputs.exit_code != '0'
        run: exit 1
