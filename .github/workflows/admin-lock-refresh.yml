name: Admin Lock Refresh One-Shot

on:
  pull_request:
    paths:
      - admin/package.json
      - admin/package-lock.json
      - admin/api/_types/vercel-node.d.ts
      - .github/workflows/admin-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Fetch exact PR head with write-capable token
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_HEAD_SHA"
          git checkout -B "$HEAD_BRANCH" FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Select hosted Node 24
        shell: bash
        run: |
          set -euo pipefail
          node24_root="$(find /opt/hostedtoolcache/node -maxdepth 1 -mindepth 1 -type d -name '24.*' | sort -V | tail -1)"
          test -x "$node24_root/x64/bin/node"
          printf '%s\n' "$node24_root/x64/bin" >> "$GITHUB_PATH"
          "$node24_root/x64/bin/node" --version | grep -E '^v24\.'
          "$node24_root/x64/bin/npm" --version

      - name: Regenerate admin lockfile from manifest
        working-directory: admin
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Prove frozen install and high-severity audit
        working-directory: admin
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          npm run check

      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          git add admin/package-lock.json
          if git diff --cached --quiet; then
            echo "admin lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): refresh admin lockfile after type-only dependency removal"
          git push origin "HEAD:${HEAD_BRANCH}"
